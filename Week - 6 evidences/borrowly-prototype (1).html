<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Borrowly – Interactive Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#FAFAF6;--card:#FFFFFF;--ink:#355B45;--mut:#54705F;--blue:#355B45;--soft:#EEF4EC;--line:#D5E2D3;--yel:#D58B70;--yelsoft:#FBEDE7;--yelink:#8A4A33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:22px;color:var(--blue);display:flex;gap:8px;align-items:center}.logo i{width:12px;height:12px;border-radius:4px;background:var(--yel);display:inline-block}
.steps{display:flex;gap:6px;font-size:13px;flex-wrap:wrap}.steps span{padding:4px 12px;border-radius:20px;background:var(--soft);color:var(--mut);font-weight:600}.steps .on{background:var(--blue);color:#fff}
main{max-width:980px;margin:0 auto;padding:20px}
h1{font-size:28px;margin:6px 0 4px}h2{font-size:20px;margin:0 0 8px}p{margin:0 0 8px}.mut{color:var(--mut)}
.note{background:var(--yelsoft);color:var(--yelink);border-left:5px solid var(--yel);padding:10px 14px;border-radius:8px;font-size:14px;margin:12px 0}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
.bar input{flex:1;min-width:200px;width:auto}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:20px;cursor:pointer;font:inherit;font-size:14px}.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:left;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:8px}
button.card{cursor:pointer}button.card:hover,button.card:focus-visible{border-color:var(--blue);outline:2px solid var(--blue)}
.ico{width:48px;height:48px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:26px}
.badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:15px;font-weight:700}
.av{background:var(--soft);color:var(--blue);border:2px solid var(--blue)}.un{background:var(--yelsoft);color:var(--yelink);border:2px solid var(--yel)}
.owner{display:flex;gap:12px;align-items:center;background:var(--soft);border:1px solid var(--line);padding:12px 14px;border-radius:12px}
.avatar{width:34px;height:34px;border-radius:17px;background:var(--card);color:var(--blue);border:2px solid var(--blue);display:grid;place-items:center;font-weight:700;flex:none}
.stars{color:var(--mut);font-size:14px}.stars b{letter-spacing:2px;color:var(--line)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}.btn.sec{background:var(--soft);color:var(--ink)}.btn:disabled{opacity:.5;cursor:not-allowed}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}@media(max-width:720px){.two{grid-template-columns:1fr}}
label{font-weight:600;font-size:14px;display:block;margin:12px 0 4px}
.tag{display:flex;gap:8px;flex-wrap:wrap}.tag span{background:var(--soft);padding:4px 10px;border-radius:8px;font-size:14px}
.back{background:none;border:0;color:var(--blue);font:inherit;font-weight:700;cursor:pointer;padding:0;margin-bottom:8px}
details{margin-top:24px}summary{cursor:pointer;font-weight:700;color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style></head><body>
<header><div class="logo"><i></i>Borrowly</div><div class="steps" id="steps"></div></header>
<main id="app"></main>
<script>
var ITEMS=[
{id:1,n:"Casio fx-991 Scientific Calculator",c:"Calculators",e:"🧮",cond:"Good",cn:"Light scratches on the case. Screen and buttons work fully.",av:true,o:"Arjun K.",oi:"2nd year · Mechanical Engg"},
{id:2,n:"Engineering Mathematics Textbook",c:"Textbooks",e:"📘",cond:"Like new",cn:"No highlighting or writing inside.",av:true,o:"Meera S.",oi:"3rd year · Civil Engg"},
{id:3,n:"Geometry Box Set",c:"Stationery",e:"📐",cond:"Well used",cn:"All pieces present. Compass is a little stiff.",av:false,back:"2 Nov",o:"Rahul D.",oi:"1st year · Architecture"},
{id:4,n:"TI-84 Graphing Calculator",c:"Calculators",e:"🔢",cond:"Good",cn:"New batteries. Includes cover.",av:true,o:"Divya P.",oi:"2nd year · Statistics"},
{id:5,n:"Organic Chemistry Textbook",c:"Textbooks",e:"🧪",cond:"Good",cn:"Some pencil notes in margins.",av:false,back:"5 Nov",o:"Karthik R.",oi:"3rd year · Chemistry"},
{id:6,n:"Highlighters and Pens Pack",c:"Stationery",e:"🖍️",cond:"Like new",cn:"6 highlighters and 4 pens, all working.",av:true,o:"Sneha M.",oi:"1st year · Commerce"}];
var CATS=["All","Calculators","Textbooks","Stationery"];
var PLACES=["Library entrance","Canteen seating area","Department office lobby","Main gate"];
var S={v:"welcome",entered:false,mode:"login",prev:"welcome",q:"",cat:"All",onlyAv:false,id:null,req:null};
var app=document.getElementById("app");
function ini(n){return n.split(" ").map(function(x){return x[0]}).join("")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function go(v,id){S.v=v;if(id)S.id=id;render();window.scrollTo(0,0)}
function item(){return ITEMS.filter(function(i){return i.id===S.id})[0]}
function steps(){if(["welcome","auth","privacy"].indexOf(S.v)>-1){document.getElementById("steps").innerHTML="";return}var L=[["home","Home"],["search","1 Search"],["details","2 Item details"],["request","3 Request"],["done","4 Sent"]];
document.getElementById("steps").innerHTML=L.map(function(s){return'<span class="'+(s[0]===S.v?"on":"")+'">'+s[1]+"</span>"}).join("")}
function avail(i){return i.av?'<span class="badge av">✓ Available now</span>':'<span class="badge un">Borrowed · back '+i.back+"</span>"}
function ownerBox(i){return'<div class="owner"><div class="avatar">'+ini(i.o)+'</div><div><div class="mut" style="font-size:12px;font-weight:700;letter-spacing:1px">OWNER</div><b style="font-size:17px">'+esc(i.o)+'</b><div class="mut" style="font-size:13px">'+esc(i.oi)+'</div><div class="stars"><b>☆☆☆☆☆</b> No ratings yet</div></div></div>'}
function search(){
var l=ITEMS.filter(function(i){return(S.cat==="All"||i.c===S.cat)&&(!S.onlyAv||i.av)&&i.n.toLowerCase().indexOf(S.q.toLowerCase())>-1});
app.innerHTML='<h1>Find something to borrow</h1><p class="mut">Calculators, textbooks and stationery from students on campus.</p>'+
'<div class="note">Prototype: sample listings and owner names are placeholders for testing, not real people or ratings.</div>'+
'<div class="bar"><input id="q" placeholder="Search items, e.g. calculator" aria-label="Search items" value="'+esc(S.q)+'">'+
'<button class="chip '+(S.onlyAv?"on":"")+'" id="av">Available now only</button></div>'+
'<div class="bar" style="margin-top:0">'+CATS.map(function(c){return'<button class="chip '+(S.cat===c?"on":"")+'" data-c="'+c+'">'+c+"</button>"}).join("")+"</div>"+
'<div class="grid">'+(l.length?l.map(function(i){return'<button class="card" data-id="'+i.id+'"><div style="display:flex;gap:12px;align-items:center"><div class="ico">'+i.e+'</div><div><b>'+esc(i.n)+'</b><div class="mut" style="font-size:14px">'+i.c+" · "+i.cond+"</div></div></div>"+avail(i)+ownerBox(i)+"</button>"}).join(""):'<p class="mut">No items match. Try another search.</p>')+"</div>"+
'<details><summary>Usability test notes (for the facilitator)</summary><div class="card" style="margin-top:10px"><p class="mut">Fill in only what a real participant says or does. These notes stay on this page and are not saved.</p>'+
'<p><b>Tasks to ask:</b> 1) Find an item that is available now. 2) Find who owns it. 3) Send a borrowing request.</p>'+
'<label for="n1">Participant (first name or initials)</label><input id="n1"><label for="n2">What they said and did</label><textarea id="n2" rows="4"></textarea><label for="n3">Where they hesitated or got stuck</label><textarea id="n3" rows="3"></textarea></div></details>';
document.getElementById("q").oninput=function(e){S.q=e.target.value;var p=e.target.selectionStart;search();var x=document.getElementById("q");x.focus();x.setSelectionRange(p,p)};
document.getElementById("av").onclick=function(){S.onlyAv=!S.onlyAv;search()};
[].forEach.call(app.querySelectorAll("[data-c]"),function(b){b.onclick=function(){S.cat=b.dataset.c;search()}});
[].forEach.call(app.querySelectorAll("[data-id]"),function(b){b.onclick=function(){go("details",+b.dataset.id)}})}
function details(){var i=item();
app.innerHTML='<button class="back" id="b">← Back to search</button><div class="two"><div class="card"><div style="display:flex;gap:14px;align-items:center"><div class="ico" style="width:64px;height:64px;font-size:34px">'+i.e+'</div><div><h1 style="font-size:24px">'+esc(i.n)+'</h1>'+avail(i)+'</div></div>'+
'<h2>Condition</h2><div class="tag"><span>'+i.cond+'</span><span>'+i.c+'</span></div><p>'+esc(i.cn)+'</p>'+
'<h2>Availability</h2><p>'+(i.av?"Free to borrow now. You choose a return date on the next step.":"Currently borrowed. Expected back on "+i.back+".")+'</p>'+
'<h2>Collection</h2><p class="mut">You and the owner agree a pick-up place on campus when you send the request.</p></div>'+
'<div class="card"><h2>Owner</h2><div class="owner"><div class="avatar">'+ini(i.o)+'</div><div><b style="font-size:18px">'+esc(i.o)+'</b><div class="mut" style="font-size:14px">'+esc(i.oi)+'</div></div></div>'+
'<h2 style="margin-top:8px">Ratings and feedback</h2><div class="stars"><b style="font-size:22px">☆☆☆☆☆</b></div><p><b>No ratings yet</b></p><p class="mut" style="font-size:14px">Feedback can only be left after a completed borrow, so nothing here is made up.</p><button class="btn sec" disabled>Leave feedback after a borrow</button>'+
'<div class="note">An owner profile or rating does not guarantee safety. Meet in a public campus place and check the item together.</div>'+
'<button class="btn" id="r">'+(i.av?"Request to borrow":"Request for when it’s back")+'</button></div></div>';
document.getElementById("b").onclick=function(){go("search")};document.getElementById("r").onclick=function(){go("request")}}
function request(){var i=item(),t=new Date().toISOString().slice(0,10);
app.innerHTML='<button class="back" id="b">← Back to item</button><h1>Request to borrow</h1><div class="two"><div class="card"><label for="d1">Borrow from</label><input type="date" id="d1" min="'+t+'" value="'+t+'"><label for="d2">Return by</label><input type="date" id="d2" min="'+t+'"><label for="pl">Collection place</label><select id="pl">'+PLACES.map(function(p){return"<option>"+p+"</option>"}).join("")+'</select><label for="m">Message to owner (optional)</label><textarea id="m" rows="3" placeholder="e.g. Need it for Thursday’s exam"></textarea><p id="err" style="color:var(--yelink);font-weight:700"></p><button class="btn" id="s">Send request</button></div>'+
'<div class="card"><h2>Summary</h2><div class="ico">'+i.e+'</div><b>'+esc(i.n)+'</b><p class="mut">Owner: '+esc(i.o)+" · No ratings yet</p>"+avail(i)+'<p class="mut" style="font-size:14px">The owner replies to confirm. Nothing is final until they accept.</p></div></div>';
document.getElementById("b").onclick=function(){go("details")};
document.getElementById("s").onclick=function(){var a=document.getElementById("d1").value,b=document.getElementById("d2").value;
if(!b||b<a){document.getElementById("err").textContent="Please choose a return date on or after the start date.";return}
S.req={a:a,b:b,p:document.getElementById("pl").value};popup()}}
function popup(){var i=item(),o=document.createElement("div");o.setAttribute("role","dialog");o.setAttribute("aria-modal","true");o.setAttribute("aria-labelledby","pt");o.style.cssText="position:fixed;inset:0;background:rgba(250,250,246,.85);display:grid;place-items:center;padding:20px;z-index:50";o.innerHTML='<div class="card" style="max-width:420px;width:100%;text-align:center;align-items:center;gap:12px;border-top:6px solid var(--yel);box-shadow:0 12px 40px rgba(53,91,69,.18)"><div class="ico" style="font-size:30px">✅</div><h2 id="pt" style="margin:0">Request submitted</h2><p style="margin:0">Your request for <b>'+esc(i.n)+'</b> has been submitted to <b>'+esc(i.o)+'</b>.</p><span class="badge un">Awaiting owner’s response</span><p class="mut" style="font-size:14px;margin:0">Nothing is final until the owner accepts. (Prototype: no message is actually sent.)</p><button class="btn" id="ok">OK</button></div>';document.body.appendChild(o);var b=o.querySelector("#ok");b.focus();b.onclick=function(){o.remove();go("done")};o.onkeydown=function(e){if(e.key==="Escape")b.click()}}
function done(){var i=item(),r=S.req;
app.innerHTML='<div class="card" style="max-width:560px;margin:20px auto;text-align:center;align-items:center"><div class="ico" style="background:var(--yelsoft)">✅</div><h1>Request sent</h1><p>Waiting for <b>'+esc(i.o)+'</b> to reply.</p><div class="tag" style="justify-content:center"><span>'+esc(i.n)+'</span><span>'+r.a+' to '+r.b+'</span><span>'+esc(r.p)+'</span></div><p class="mut" style="font-size:14px">Prototype only: no message was actually sent.</p><button class="btn" id="n">Back to search</button></div>';
document.getElementById("n").onclick=function(){go("search")}}
function welcome(){app.innerHTML='<div style="text-align:center;padding:48px 0 24px"><div class="ico" style="margin:0 auto 14px;width:64px;height:64px;font-size:32px">📚</div><h1 style="font-size:40px;margin:0 0 8px;line-height:1.2">Welcome to Borrowly</h1><p class="mut" style="max-width:560px;margin:0 auto 24px;font-size:18px;text-wrap:balance">Borrow what you need from other students on campus, without buying it.</p><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><button class="btn" id="a">Get started</button><button class="btn sec" id="g">Continue as guest</button></div><p style="margin-top:20px"><button class="back" id="pv">How Borrowly handles privacy</button></p></div>';
document.getElementById("a").onclick=function(){go("auth")};document.getElementById("g").onclick=function(){S.entered=true;go("home")};document.getElementById("pv").onclick=function(){S.prev="welcome";go("privacy")}}
function auth(){var su=S.mode==="signup";
app.innerHTML='<button class="back" id="b">← Back</button><div class="card" style="max-width:460px;margin:12px auto"><div style="display:flex;gap:8px"><button class="chip '+(su?"":"on")+'" id="t1">Log in</button><button class="chip '+(su?"on":"")+'" id="t2">Sign up</button></div><h1 style="font-size:26px;margin:8px 0 0">'+(su?"Create your account":"Welcome back")+'</h1>'+(su?'<label for="nm">Name</label><input id="nm" autocomplete="off">':'')+'<label for="em">College email</label><input id="em" type="email" autocomplete="off"><label for="pw">Password</label><input id="pw" type="password" autocomplete="off"><div class="note">Prototype only: nothing you type here is checked, sent or saved, and no account is created.</div><button class="btn" id="c">Continue</button><button class="btn sec" id="g">Continue as guest</button><p style="margin:6px 0 0"><button class="back" id="pv">Privacy</button></p></div>';
document.getElementById("b").onclick=function(){go("welcome")};document.getElementById("t1").onclick=function(){S.mode="login";auth()};document.getElementById("t2").onclick=function(){S.mode="signup";auth()};
var f=function(){S.entered=true;go("home")};document.getElementById("c").onclick=f;document.getElementById("g").onclick=f;document.getElementById("pv").onclick=function(){S.prev="auth";go("privacy")}}
function privacy(){app.innerHTML='<button class="back" id="b">← Back</button><h1>Privacy</h1><p class="mut">A plain-language summary for this prototype.</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><h2>In this prototype</h2><p>✓ No account is created, and nothing you type is saved or sent.</p><p>✓ No location, camera, contacts or notification access is requested.</p><p>✓ Items and owners are samples, and there are no real ratings.</p><p>✓ Usability notes stay on the page only.</p></div><div class="card"><h2>Planned for a real version (not built yet)</h2><p>• Share only what a borrower needs: owner name, year and department.</p><p>• Ratings and feedback only after a completed borrow.</p><p>• Pick-up places agreed between students.</p><div class="note">An owner profile or rating does not guarantee safety. Meet in a public campus place.</div></div></div>';
document.getElementById("b").onclick=function(){go(S.prev||"welcome")}}
function home(){var F=[["🔎","See availability instantly","Know what is free to borrow before you ask."],["📋","Clear item condition","Read the condition and notes first."],["👤","Know the owner","Owner name and profile on every item. Ratings appear only after real borrows."],["📍","Easy collection","Agree a pick-up place on campus."]];
app.innerHTML='<div style="text-align:center;padding:36px 0 24px"><span class="badge un">Student-to-student borrowing</span><h1 style="font-size:40px;margin:14px 0 8px;line-height:1.2">Borrow what you need,<br>skip the purchase.</h1><p class="mut" style="max-width:640px;margin:0 auto 20px;font-size:18px;text-wrap:balance">Borrowly helps college students temporarily borrow calculators, textbooks and stationery from other students on campus, so they can see what is available, check the condition and request it in a few taps.</p><button class="btn" id="go">Start borrowing</button></div><div class="grid">'+F.map(function(f){return'<div class="card"><div class="ico">'+f[0]+'</div><b>'+f[1]+'</b><span class="mut" style="font-size:14px">'+f[2]+'</span></div>'}).join("")+'</div><p class="mut" style="text-align:center;font-size:14px;margin-top:24px">Prototype for testing. Sample items and owners are placeholders. <button class="back" id="pv" style="margin:0">Privacy</button></p>';
document.getElementById("go").onclick=function(){go("search")};document.getElementById("pv").onclick=function(){S.prev="home";go("privacy")}}
function render(){steps();({welcome:welcome,auth:auth,privacy:privacy,home:home,search:search,details:details,request:request,done:done})[S.v]();var lg=document.querySelector(".logo");lg.style.cursor="pointer";lg.onclick=function(){go(S.entered?"home":"welcome")}}
render();
</script></body></html>
